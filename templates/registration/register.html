{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
  <section class="panel narrow">
    <h1>Create account</h1>
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Register</button>
    </form>
    <p>Already registered? <a href="{% url 'login' %}">Log in</a>.</p>
  </section>
{% endblock %}
