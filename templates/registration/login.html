{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
  <section class="panel narrow">
    <h1>Log in</h1>
    <form method="post" class="stacked-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
    <p>New here? <a href="{% url 'register' %}">Create an account</a>.</p>
  </section>
{% endblock %}
